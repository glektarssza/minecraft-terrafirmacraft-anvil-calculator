# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Lint
on:
  workflow_call:
    inputs:
      git-ref:
        description: |
          The Git reference to run the workflow on.

          Must be a valid commit-ish (a branch, tag, commit, etc.).

          Defaults to the reference that triggered the workflow for push and
          pull request events ("github.ref") and the head SHA ("github.sha") for
          all other events.
        type: string
        required: false
        default: ${{github.ref || github.sha || github.event.repository.default_branch}}
      node-version:
        description: |
          The NodeJS version to use.

          Use "nvmrc" to use the value in the repository ".nvmrc" file.

          Defaults to "latest".
        type: string
        required: false
        default: latest
      package-manager:
        description: |
          The NodeJS package manager to use.

          Defaults to "pnpm".
        type: string
        required: false
        default: pnpm
      package-manager-version:
        description: |
          The NodeJS package manager version to use.

          Use "packageManifest" to use the value specified in the package
          manifest.

          Defaults to "latest".
        type: string
        required: false
        default: latest
    secrets:
      github-token:
        description: |
          The token to use for authentication when making calls to the GitHub
          APIs.

          Defaults to the value in "secrets.GITHUB_TOKEN" if not provided.
        required: false
env:
  GITHUB_TOKEN: ${{secrets.github-token || secrets.GITHUB_TOKEN}}
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      # -- Needed to clone the repository
      contents: read
    steps:
      - id: clone-repository
        name: Clone the repository
        uses: actions/checkout@v7
        with:
          ref: ${{inputs.git-ref}}
          lfs: true
          token: ${{env.GITHUB_TOKEN}}
      - id: setup-pnpm-package-manager-manifest
        name: Setup NodeJS Package Manager (Package Manifest)
        if: inputs.package-manager == 'pnpm' && inputs.package-manager-version == 'packageManifest'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ./package.json
          run_install: false
          cache: true
          cache_dependency_path: ./pnpm-lock.yaml
      - id: setup-pnpm-package-manager-version
        name: Setup NodeJS Package Manager (Version)
        if: inputs.package-manager == 'pnpm' && inputs.package-manager-version != 'packageManifest'
        uses: pnpm/action-setup@v6
        with:
          version: ${{inputs.package-manager-version}}
          run_install: false
          cache: true
          cache_dependency_path: ./pnpm-lock.yaml
      - id: setup-nodejs-version
        name: Setup NodeJS (Version)
        if: inputs.node-version != 'nvmrc'
        uses: actions/setup-node@v7
        with:
          node-version: ${{inputs.node-version}}
          token: ${{env.GITHUB_TOKEN}}
      - id: setup-nodejs-nvmrc
        name: Setup NodeJS (.nvmrc)
        if: inputs.node-version == 'nvmrc'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          token: ${{env.GITHUB_TOKEN}}
      - id: setup-non-pnpm-package-manager
        name: Setup NodeJS Package Manager
        if: inputs.package-manager != 'pnpm'
        run: |
          npm install -g ${{inputs.package-manager}}@${{inputs.package-manager-version}}
      - id: prepare-python
        name: Prepare Python
        uses: actions/setup-python@v7
        with:
          python-version: '>=3'
      - id: install-pre-commit
        name: Install pre-commit
        run: ./scripts/install-pre-commit.sh --force
      - id: lint
        name: Lint
        run: |
          pre-commit run --all-files
